services:
  assetdomain-api:
    container_name: cascade-ctl-assetservice
    build:
      context: .
      dockerfile: src/Cascade.CTL.AssetService/Dockerfile
    ports:
      - "5100:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASSETDOMAIN_API_KEY=${ASSETDOMAIN_API_KEY:-dev-local-asset-domain-key-CHANGE-ME}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped
